<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Darkest Dungeon Save Editor</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <main class="shell" aria-labelledby="app-title">
      <div class="crest" aria-hidden="true"><span>DD</span></div>
      <p class="eyebrow" data-i18n="app.eyebrow"></p>
      <h1 id="app-title" data-i18n="app.title"></h1>
      <p class="intro" data-i18n="app.intro"></p>

      <section class="connection" aria-live="polite" aria-atomic="true">
        <span id="connection-indicator" class="indicator" aria-hidden="true"></span>
        <div>
          <h2 id="connection-title" data-i18n="connection.connecting"></h2>
          <p id="connection-message" data-i18n="connection.checking"></p>
        </div>
      </section>

      <dl id="service-details" class="details" hidden>
        <div><dt data-i18n="details.serviceState"></dt><dd id="service-state">—</dd></div>
        <div><dt data-i18n="details.appVersion"></dt><dd id="app-version">—</dd></div>
        <div><dt data-i18n="details.gatewayApi"></dt><dd id="api-version">—</dd></div>
      </dl>

      <section id="f1-panel" class="panel" hidden>
        <div class="panel-heading">
          <div>
            <p class="eyebrow left" data-i18n="f1.eyebrow"></p>
            <h2 data-i18n="f1.workspace"></h2>
          </div>
          <div class="panel-heading-actions">
            <span id="configuration-state" class="badge"></span>
            <button id="settings-return-town" class="secondary" type="button" data-i18n="settings.backToTown" hidden></button>
          </div>
        </div>
        <form id="configuration-form" class="settings-form">
          <label><span data-i18n="settings.gameRoot"></span><span class="path-picker"><input id="game-root" name="gameRoot" type="text" readonly required><button type="button" data-directory-kind="game" data-i18n-aria="picker.game">…</button></span></label>
          <label><span data-i18n="settings.saveRoot"></span><span class="path-picker"><input id="save-roots" name="saveRoots" type="text" readonly><button type="button" data-directory-kind="save" data-i18n-aria="picker.save">…</button></span></label>
          <label><span data-i18n="settings.workshopRoot"></span><span class="path-picker"><input id="workshop-roots" name="workshopRoots" type="text" readonly><button type="button" data-directory-kind="workshop" data-i18n-aria="picker.workshop">…</button></span></label>
          <label><span data-i18n="settings.localModRoot"></span><span class="path-picker"><input id="local-mod-roots" name="localModRoots" type="text" readonly><button type="button" data-directory-kind="localMod" data-i18n-aria="picker.localMod">…</button></span></label>
          <label><span data-i18n="settings.backupRoot"></span><span class="path-picker"><input id="backup-root" name="backupRoot" type="text" readonly required><button type="button" data-directory-kind="backup" data-i18n-aria="picker.backup">…</button></span></label>
          <label><span data-i18n="settings.maxBackupCount"></span><input id="max-backup-count" name="maxBackupCount" type="number" min="1" max="10000" required></label>
          <label><span data-i18n="settings.language"></span><select id="language" name="language" required><option value="en_us"></option><option value="zh_cn"></option></select></label>
          <label class="checkbox"><input id="auto-edit-save-enabled" name="autoEditSaveEnabled" type="checkbox"><span data-i18n="settings.autoEditSave"></span></label>
          <label><span data-i18n="settings.autoEditSaveInterval"></span><input id="auto-edit-save-interval" name="autoEditSaveIntervalSeconds" type="number" min="1" max="86400" required></label>
          <button id="configuration-submit" type="submit" data-i18n="settings.save"></button>
          <p id="configuration-message" class="form-message" role="status"></p>
        </form>
        <section id="initialization-card" class="initialization-card" hidden>
          <h3 data-i18n="initialization.title"></h3>
          <p id="initialization-work"></p>
          <div class="progress-track"><span id="initialization-progress"></span></div>
          <p id="initialization-message" class="form-message"></p>
          <dl class="initialization-times">
            <div><dt data-i18n="initialization.baseTime"></dt><dd id="initialization-base-time">—</dd></div>
            <div><dt data-i18n="initialization.modTime"></dt><dd id="initialization-mod-time">—</dd></div>
            <div><dt data-i18n="initialization.totalTime"></dt><dd id="initialization-total-time">—</dd></div>
          </dl>
          <button id="reinitialize-mods" type="button" class="secondary" data-i18n="initialization.reinitialize" hidden></button>
        </section>
        <section id="database-mods-card" class="profile-section" hidden>
          <div class="profile-heading"><h3 data-i18n="profiles.title"></h3><button id="refresh-profiles" type="button" class="secondary" data-i18n="profiles.refresh"></button></div>
          <p id="profiles-message" class="form-message"></p>
          <ul id="profile-list" class="profile-list"></ul>
        </section>
        <div id="recovery-card" class="recovery-card" hidden>
          <h3 data-i18n="recovery.title"></h3>
          <p id="recovery-message"></p>
          <div class="actions">
            <button id="restore-recovery" type="button" data-i18n="recovery.restore"></button>
            <button id="discard-recovery" type="button" class="secondary" data-i18n="recovery.discard"></button>
          </div>
        </div>
      </section>

      <section id="town-shell" class="town-shell" hidden aria-label="Town editor">
        <div class="town-stage" id="town-stage">
          <div class="town-art-layer">
            <img id="town-background" class="town-background" alt="">
            <div class="missing-art town-background-fallback" data-missing-art="town.background" hidden></div>
          </div>
          <header class="town-resource-bar">
            <div class="town-estate"><span class="town-mark">DD</span><span data-i18n="town.estateName">Estate</span></div>
          </header>
          <div class="town-title"><span data-i18n="town.title">Hamlet</span><small data-i18n="town.preview">F2 visual preview</small></div>
          <aside class="town-building-panel">
            <div class="town-panel-heading town-building-heading">
              <h2 data-i18n="town.buildings">建筑</h2>
              <button id="building-maximize-all" class="icon-action" type="button" data-i18n-title="town.maximizeAllBuildingsTip" data-i18n-aria="town.maximizeAllBuildingsTip">⬆</button>
            </div>
            <div id="building-list" class="building-list"><p class="town-data-message" data-i18n="town.loadingData"></p></div>
          </aside>
          <aside class="town-roster-panel">
            <h2 data-i18n="town.roster">Roster</h2>
            <div id="hero-list" class="hero-list"><p class="town-data-message" data-i18n="town.loadingData"></p></div>
          </aside>
          <aside class="town-trinket-panel">
            <div class="town-panel-heading trinket-heading">
              <h2 data-i18n="town.trinketChest">Trinket Chest</h2>
              <div class="trinket-actions">
                <button id="trinket-add" type="button" data-i18n="trinket.add">添加饰品</button>
                <button id="trinket-batch-add" type="button" data-i18n="trinket.batchAdd">批量添加</button>
                <button id="trinket-batch-delete" type="button" data-i18n="trinket.batchDelete">批量删除</button>
              </div>
            </div>
            <div id="trinket-grid" class="chest-grid"><p class="town-data-message" data-i18n="town.loadingData"></p></div>
          </aside>
          <aside class="town-resource-panel">
            <div class="town-panel-heading"><h2 data-i18n="town.resources">资源</h2><small data-i18n="town.editableResources">可编辑</small></div>
            <div id="resource-grid" class="resource-grid"><p class="town-data-message" data-i18n="town.loadingData"></p></div>
          </aside>
          <div class="town-history-controls" aria-label="History controls">
            <button id="town-undo" type="button" class="secondary" data-i18n="town.undo">撤销</button>
            <button id="town-redo" type="button" class="secondary" data-i18n="town.redo">重做</button>
          </div>
          <div class="town-utility-controls">
            <button id="town-reload-profile" class="town-reload-button" type="button" data-i18n-title="town.reloadProfileTip" data-i18n-aria="town.reloadProfileTip">↻</button>
            <button id="town-settings-button" class="town-settings-button" type="button" data-i18n="town.settings">设置</button>
          </div>
          <button id="town-save" class="town-save-button" type="button" data-i18n="town.save">保存</button>
          <footer class="town-status-bar"><span id="town-save-state" class="town-save-state" data-i18n="town.clean">未修改</span></footer>
        </div>
      </section>

      <dialog id="building-editor" class="building-editor">
        <div class="building-editor-shell">
          <header class="building-editor-heading">
            <div><small id="building-editor-kicker" class="eyebrow left"></small><h2 id="building-editor-title"></h2></div>
            <button id="building-editor-close" class="secondary" type="button" data-i18n="town.close">关闭</button>
          </header>
          <div id="building-editor-actions" class="building-editor-actions"></div>
          <p id="building-editor-hint" class="building-editor-hint"></p>
          <div id="building-editor-content" class="building-editor-content"></div>
        </div>
      </dialog>

      <dialog id="trinket-selector" class="building-editor trinket-selector">
        <div class="building-editor-shell">
          <header class="building-editor-heading">
            <div><small class="eyebrow left" data-i18n="trinket.selectorKicker">内容数据库</small><h2 id="trinket-selector-title"></h2></div>
            <button id="trinket-selector-close" class="secondary" type="button" data-i18n="town.close">关闭</button>
          </header>
          <div class="trinket-search-controls">
            <input id="trinket-search" type="search" data-i18n-placeholder="trinket.searchPlaceholder" placeholder="搜索 ID、名称、描述或 Mod">
            <select id="trinket-mod-filter" aria-label="Mod filter"><option value="" data-i18n="trinket.allMods">所有 Mod</option></select>
            <select id="trinket-class-filter" aria-label="Class filter"><option value="" data-i18n="trinket.allClasses">所有职业</option></select>
          </div>
          <p id="trinket-selector-message" class="building-editor-hint"></p>
          <div id="trinket-selector-list" class="trinket-selector-list"></div>
          <footer id="trinket-batch-footer" class="trinket-batch-footer" hidden>
            <label><input id="trinket-only-new" type="checkbox"><span data-i18n="trinket.onlyNew">只添加库存中尚未存在的饰品</span></label>
            <button id="trinket-batch-confirm" type="button" data-i18n="trinket.applyBatch">执行</button>
          </footer>
        </div>
      </dialog>

      <p id="connection-error" class="error" role="alert" hidden></p>
      <p class="footnote" data-i18n="app.footnote"></p>
    </main>
  </body>
</html>
